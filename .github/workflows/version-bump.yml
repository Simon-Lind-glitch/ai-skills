name: version-bump

# Auto-bumps the plugin version on every push to main, reading Conventional
# Commit types since the last release tag:
#   feat!/fix!/BREAKING CHANGE -> major
#   feat                       -> minor
#   fix                        -> patch
#   anything else              -> no release (chore/docs/refactor/... alone don't bump)
# The bump commit carries [skip ci], and GitHub skips runs whose head commit
# says [skip ci], so this never loops.
#
# The decision itself lives in .github/scripts/decide-bump.sh, so it can be run
# and tested locally rather than only by pushing to main and watching what
# happens. .github/scripts/test-version-bump.sh covers it, and runs here first.

on:
  push:
    branches: [main]

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the release logic
        run: .github/scripts/test-version-bump.sh

      - name: Decide bump level
        id: decide
        run: |
          set -euo pipefail
          CURRENT=$(jq -r '.version' .claude-plugin/plugin.json)
          BUMP=$(.github/scripts/decide-bump.sh)
          NEW=$(.github/scripts/next-version.sh "$CURRENT" "$BUMP")
          echo "Current $CURRENT, bump $BUMP, new $NEW"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Apply bump, tag, and release
        if: steps.decide.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.decide.outputs.new }}
          BUMP: ${{ steps.decide.outputs.bump }}
        run: |
          set -euo pipefail
          jq --arg v "$NEW" '.version = $v' .claude-plugin/plugin.json > plugin.tmp
          mv plugin.tmp .claude-plugin/plugin.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore(release): v$NEW [skip ci]"
          git tag "v$NEW"
          git push origin HEAD:main --tags

          gh release create "v$NEW" --title "v$NEW" \
            --notes "Automated $BUMP release. See commits since the previous tag for details."
